
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <div id="bookInformation">
        <p>Loading book information...</p>
    </div>

    <script>
        async function loadBooks() {
            const display = document.getElementById("bookInformation");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to retrieve book data.");
                }

                const data = await response.json();

                display.innerHTML = "";

                // Display the first book's title
                const firstTitle = document.createElement("p");
                firstTitle.textContent = "First Book Title: " + data.books[0].title;
                display.appendChild(firstTitle);

                // Display the second book's author
                const secondAuthor = document.createElement("p");
                secondAuthor.textContent = "Second Book Author: " + data.books[1].author;
                display.appendChild(secondAuthor);

                // Display genres of both books
                data.books.forEach(function(book) {
                    const bookGenre = document.createElement("p");

                    bookGenre.textContent =
                        book.title + " — " + book.genres.join(", ");

                    display.appendChild(bookGenre);
                });

            } catch (error) {
                display.textContent =
                    "Error: Unable to load book information. Please try again.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
